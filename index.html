<style>
/* Layout: full-bleed sunset hero → render strip → dark "drafting table" explorer (elevation | plan | unit sheet) → closing CTA */
:root{
  --ink:#0f1a20;        /* evening sea */
  --ink-2:#16242c;
  --ink-3:#1e313a;
  --stone:#ece3d2;      /* travertine facade */
  --stone-dim:#b8b0a2;
  --mute:#7f8e92;
  --gilt:#d2a965;       /* sunset gold */
  --line:rgba(236,227,210,.14);
  --t1:#6fb3b0; --t2:#d2a965; --t3:#d77f62; --t4:#a48bd0;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Jost","Avenir Next","Futura","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--stone);font-family:var(--f-body);font-size:16px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gilt);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gilt);font-weight:500}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.05;margin:.35em 0 0;text-wrap:balance;letter-spacing:-.01em}
h2 em{font-style:italic;color:var(--gilt)}
.lede{color:var(--stone-dim);max-width:58ch;margin:1rem 0 0;font-weight:300;font-size:1.06rem}

/* NAV */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;transition:background .4s,backdrop-filter .4s}
.nav.solid{background:rgba(15,26,32,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.mark{font-family:var(--f-display);letter-spacing:.42em;font-size:1rem;text-decoration:none;padding-left:.42em}
.nav nav{display:flex;gap:28px;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase}
.nav nav a{text-decoration:none;color:var(--stone-dim);transition:color .2s}
.nav nav a:hover{color:var(--stone)}
.btn{display:inline-flex;align-items:center;gap:.6em;border:1px solid var(--gilt);color:var(--stone);background:transparent;padding:.72em 1.3em;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,color .25s;border-radius:0}
.btn:hover{background:var(--gilt);color:var(--ink)}
.btn.solid{background:var(--gilt);color:var(--ink)}
.btn.solid:hover{background:var(--stone)}
@media (max-width:760px){.nav nav{display:none}}

/* HERO */
.hero{position:relative;height:min(92svh,860px);min-height:560px;overflow:hidden;isolation:isolate;display:flex;align-items:flex-end}
.hero .bg{position:absolute;inset:-4%;background:url(r0.webp) center 60%/cover no-repeat;animation:drift 26s ease-in-out infinite alternate;z-index:-3}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:
  linear-gradient(180deg,rgba(15,26,32,.55) 0%,rgba(15,26,32,0) 28%,rgba(15,26,32,0) 48%,rgba(15,26,32,.92) 100%)}
.mist{position:absolute;inset:-20% -40%;z-index:-1;pointer-events:none;opacity:.55;mix-blend-mode:screen;
  background:radial-gradient(40% 18% at 30% 40%,rgba(255,236,205,.35),transparent 70%),radial-gradient(30% 14% at 70% 30%,rgba(255,226,190,.28),transparent 70%),radial-gradient(50% 20% at 55% 62%,rgba(255,240,220,.18),transparent 70%);
  animation:mist 34s linear infinite}
@keyframes drift{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.14) translate3d(-1.5%,-1%,0)}}
@keyframes mist{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.hero-in{width:100%;padding-block:0 clamp(40px,7vh,72px)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(3.6rem,13vw,10.5rem);line-height:.9;margin:0;letter-spacing:.14em;padding-left:.14em;animation:rise 1.8s cubic-bezier(.2,.7,.2,1) both}
.hero .sub{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;margin-top:22px;border-top:1px solid rgba(236,227,210,.28);padding-top:20px}
.hero .sub p{margin:0;max-width:40ch;font-size:1.1rem;font-weight:300;color:var(--stone)}
.facts{display:flex;gap:clamp(20px,4vw,48px)}
.facts div{display:grid}
.facts b{font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.facts span{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--stone-dim);margin-top:6px}
@keyframes rise{from{letter-spacing:.5em;opacity:.15;filter:blur(6px)}to{letter-spacing:.14em;opacity:1;filter:blur(0)}}

/* GALLERY */
.gallery{padding-block:clamp(64px,10vw,120px) 0}
.g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.g-prog{display:flex;align-items:center;gap:14px;min-width:min(320px,100%);color:var(--muted,#9aa7ad);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}.gp-n{font-family:"Bodoni Moda",serif;font-size:1.05rem;letter-spacing:.06em;white-space:nowrap}.gp-n b{color:var(--gilt);font-weight:400;font-size:1.6rem}.gp-bar{flex:1;height:1px;background:var(--line);position:relative;min-width:90px}.gp-bar i{position:absolute;left:0;top:-1px;height:3px;width:8%;background:var(--gilt);transition:width .35s ease}.gp-hint{white-space:nowrap;animation:gpH 2.4s ease-in-out infinite}@keyframes gpH{0%,100%{opacity:.45;transform:translateX(0)}50%{opacity:1;transform:translateX(6px)}}@media (max-width:700px){.g-prog{width:100%;margin-top:6px}}
.g-ctrl button{width:46px;height:46px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:1.1rem;transition:border-color .2s}
.g-ctrl button:hover{border-color:var(--gilt)}
.strip{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:36px;padding-bottom:14px;scrollbar-width:thin;scrollbar-color:var(--ink-3) transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px),calc((100vw - 1320px)/2 + 16px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip figure{margin:0;flex:0 0 min(78vw,620px);scroll-snap-align:start;position:relative;overflow:hidden}
.strip figure:nth-child(3n+2){flex-basis:min(62vw,440px)}
@media (max-width:700px){.strip img{height:auto!important;aspect-ratio:4/3!important}.strip figure,.strip figure:nth-child(3n+2){flex-basis:82vw!important}}
.strip img{display:block;width:100%;height:min(58vh,460px);aspect-ratio:auto;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.strip figure:hover img{transform:scale(1.05)}
.strip figcaption{display:flex;justify-content:space-between;gap:12px;padding-top:12px;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--stone-dim)}
.strip figcaption i{font-style:normal;color:var(--gilt);font-variant-numeric:tabular-nums}

/* EXPLORER */
.explore{padding-block:clamp(72px,11vw,140px)}
.blocks{display:flex;gap:0;margin-top:36px;border-bottom:1px solid var(--line);overflow-x:auto}
.blocks button{background:none;border:0;padding:14px 22px 16px;cursor:pointer;font-family:var(--f-display);font-size:1.25rem;color:var(--mute);position:relative;white-space:nowrap}
.blocks button small{display:block;font-family:var(--f-body);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;margin-top:2px}
.blocks button[aria-selected="true"]{color:var(--stone)}
.blocks button[aria-selected="true"]::after{content:"";position:absolute;left:22px;right:22px;bottom:-1px;height:2px;background:var(--gilt)}
.blocks button:disabled{cursor:default}
.board{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;margin-top:28px}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}

.elev{position:relative}
.elev svg{width:100%;height:auto;display:block}
.elev .fl{cursor:pointer}
.elev .fl rect.band{fill:var(--ink-2);stroke:var(--line);transition:fill .25s}
.elev .fl .win{fill:rgba(236,227,210,.13);transition:fill .25s}
.elev .fl text{fill:var(--stone-dim);font-family:var(--f-body);font-size:11px;letter-spacing:.08em}
.elev .fl:hover rect.band{fill:var(--ink-3)}
.elev .fl:hover .win{fill:rgba(236,227,210,.35)}
.elev .fl.on rect.band{fill:rgba(210,169,101,.22);stroke:var(--gilt)}
.elev .fl.on .win{fill:var(--gilt)}
.elev .fl.on text{fill:var(--stone)}
.elev-cap{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:10px;text-align:center}
.chips{display:none;gap:6px;overflow-x:auto;padding-bottom:6px}
.chips button{flex:0 0 auto;min-width:46px;height:42px;border:1px solid var(--line);background:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.chips button.on{border-color:var(--gilt);background:rgba(210,169,101,.2)}

.sheet{min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 24px}
.sheet-head h3{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;font-variant-numeric:lining-nums}
.sheet-head h3 span{color:var(--mute);font-size:1rem;font-family:var(--f-body);letter-spacing:.06em;margin-left:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;padding:7px 12px;cursor:pointer;font-size:.8rem;letter-spacing:.04em;transition:opacity .2s,border-color .2s}
.legend button i{width:10px;height:10px;display:inline-block}
.legend button b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--stone-dim)}
.legend button[aria-pressed="false"]{opacity:.38}
.legend button:hover{border-color:var(--stone-dim)}

.planbox{position:relative;margin-top:18px;background:#101b21;border:1px solid var(--line);overflow:hidden}
.planbox svg{display:block;width:100%;height:auto}
.planbox .grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.25}
.u{cursor:pointer;fill-opacity:.26;stroke-width:2.2;transition:fill-opacity .25s,stroke-width .25s,opacity .3s}
.u.t1{fill:var(--t1);stroke:var(--t1)} .u.t2{fill:var(--t2);stroke:var(--t2)} .u.t3{fill:var(--t3);stroke:var(--t3)} .u.t4{fill:var(--t4);stroke:var(--t4)}
.u:hover,.u.hot{fill-opacity:.62;stroke-width:3.4}
.u.off{opacity:.08;pointer-events:none}
.ulabel{pointer-events:none;font-family:var(--f-body);font-weight:600;font-size:15px;fill:#fff;paint-order:stroke;stroke:rgba(10,18,22,.75);stroke-width:4px;text-anchor:middle;letter-spacing:.04em}
.ulabel.off{opacity:0}
.planbox .scroller{overflow-x:auto;scrollbar-width:thin}
@media (max-width:700px){.planbox svg{min-width:760px}.planbox .compass{display:none}}
.planbox .compass{position:absolute;right:12px;bottom:10px;font-size:.66rem;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.planbox.swap svg{animation:planin .7s cubic-bezier(.2,.7,.2,1)}
@keyframes planin{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.planbox.swap .u{animation:unitin .9s ease both}
@keyframes unitin{from{fill-opacity:0;stroke-opacity:0}}

.tip{position:fixed;z-index:70;pointer-events:none;background:rgba(15,26,32,.94);border:1px solid var(--gilt);padding:10px 14px;min-width:150px;transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .15s;backdrop-filter:blur(6px)}
.tip.show{opacity:1}
.tip b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;display:block;line-height:1}
.tip span{font-size:.8rem;color:var(--stone-dim);font-variant-numeric:tabular-nums}

.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}
.ulist button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;text-align:left;background:var(--ink-2);border:1px solid transparent;border-left:3px solid var(--c);padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s}
.ulist button:hover,.ulist button.hot{background:var(--ink-3);border-color:var(--line);border-left-color:var(--c)}
.ulist b{font-family:var(--f-display);font-weight:500;font-size:1.15rem;font-variant-numeric:lining-nums tabular-nums}
.ulist span{font-size:.78rem;color:var(--stone-dim);font-variant-numeric:tabular-nums;justify-self:end}
.ulist em{grid-column:1/-1;font-style:normal;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ulist button.off{display:none}

/* UNIT DRAWER */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(6,11,14,.6);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:90;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--ink);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.75,.15,1);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) 28px}
.drawer.open{transform:none}
.dr-top{display:flex;justify-content:space-between;align-items:center}
.x{width:44px;height:44px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:1.2rem}
.x:hover{border-color:var(--gilt)}
.dr-title{font-family:var(--f-display);font-weight:400;font-size:clamp(3.2rem,9vw,4.6rem);line-height:1;margin:18px 0 4px;font-variant-numeric:lining-nums}
.dr-sub{color:var(--stone-dim);letter-spacing:.06em}
.tag{display:inline-block;padding:3px 10px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);background:var(--c);margin-left:8px;vertical-align:middle}
.zoom{margin-top:22px;background:#101b21;border:1px solid var(--line)}
.zoom svg{display:block;width:100%;height:auto}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:22px}
.specs div{background:var(--ink);padding:16px 18px}
.specs dt{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.specs dd{margin:6px 0 0;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:lining-nums tabular-nums}
.specs dd small{font-family:var(--f-body);font-size:.85rem;color:var(--stone-dim);margin-left:3px}
.price{margin-top:22px;padding:18px;border:1px dashed rgba(210,169,101,.5);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.price p{margin:0;color:var(--stone-dim);font-size:.95rem}
.dr-cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.dr-cta .btn{justify-content:center}
.phone{margin-top:14px;font-size:.85rem;color:var(--mute);text-align:center}
.phone span{color:var(--stone);user-select:all;font-variant-numeric:tabular-nums}
.dr-nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.dr-nav button{flex:1;background:transparent;border:1px solid var(--line);padding:12px;cursor:pointer;letter-spacing:.08em;font-size:.85rem}
.dr-nav button:hover{border-color:var(--gilt)}

/* CLOSE */
.closing{position:relative;overflow:hidden;isolation:isolate;padding-block:clamp(90px,14vw,180px)}
.closing .bg{position:absolute;inset:0;background:url(r11.webp) center/cover;z-index:-2;transform:scale(1.06);animation:drift 30s ease-in-out infinite alternate}
.closing::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(15,26,32,.94) 0%,rgba(15,26,32,.7) 45%,rgba(15,26,32,.15) 100%)}
.closing h2{max-width:14ch}
.closing .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
footer{border-top:1px solid var(--line);padding-block:26px;color:var(--mute);font-size:.78rem;letter-spacing:.08em}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ===== v3: mobile building, statuses, editor ===== */
@media (max-width:900px){
  .board{grid-template-columns:112px minmax(0,1fr);gap:16px 18px;align-items:center}
  .sheet{display:contents}
  .elev{grid-column:1;grid-row:1}
  .sheet-head{grid-column:2;grid-row:1;flex-direction:column;align-items:flex-start}
  .sheet-head h3{font-size:1.7rem}
  .planbox,.ulist,.planhint{grid-column:1/-1}
  .elev .fl text{font-size:13px}
  .elev-cap{display:none}
}
.avail{font-size:.82rem;color:var(--stone-dim);letter-spacing:.04em;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.planhint{font-size:.78rem;color:var(--mute);margin-top:8px}
@media (min-width:701px){.planhint{display:none}}
:root{--ok:#7fc39a;--res:#f08a24;--sold:#3fbf72;--pend:#9aa6b2}
.u.sold{fill:url(#hSold)!important;fill-opacity:1!important;stroke:var(--sold)!important;stroke-width:2.8}
.u.res{fill:url(#hRes)!important;fill-opacity:1!important;stroke:var(--res)!important;stroke-width:2.8}
.u.pend{fill:#9aa6b2!important;fill-opacity:.12!important;stroke:var(--pend)!important;stroke-dasharray:8 6;stroke-width:2.2}
.emk.pend{fill:#ff9a3c;color:#ff9a3c}.emk.saved{fill:#58d68d;color:#58d68d}
.ulist b .emk{font-family:var(--f-body);font-size:.9rem;font-weight:700}
.ulabel.st{font-size:11px;letter-spacing:.14em;font-weight:700}
.ulabel.st.sold{fill:#4fd585}.ulabel.st.res{fill:#ffa244}.ulabel.st.pend{fill:#c3ccd6}
.legend .lg{display:inline-flex;align-items:center;gap:8px;padding:7px 4px;font-size:.8rem;color:var(--stone-dim)}
.legend .lg i{width:13px;height:13px;display:inline-block}
.sw-sold{background:repeating-linear-gradient(45deg,var(--sold) 0 2px,transparent 2px 5px);border:1.5px solid var(--sold)}
.sw-res{background:repeating-linear-gradient(0deg,var(--res) 0 2px,transparent 2px 5px);border:1.5px solid var(--res)}
.sw-pend{border:1.5px dashed var(--pend)}
.elev .fl .free{fill:var(--ok);font-size:10px}
.elev .fl.soon{cursor:not-allowed}
.elev .fl.soon rect.band{fill:#141f25;stroke:rgba(154,166,178,.35);stroke-dasharray:4 3}
.elev .fl.soon .win{fill:rgba(154,166,178,.08)!important}
.elev .fl.soon .free{display:none}

function counts(list){ const c={free:0,res:0,sold:0,pend:0}; list.forEach(u=>c[u.s]=(c[u.s]||0)+1); return c; }

  const s = el("svg",{viewBox:`0 0 ${W} ${H}`,role:"listbox","aria-label":"Mərtəbələr"},1);
  s.append(el("path",{d:`M34 ${top-4} L166 ${top-4} L160 ${top-18} L40 ${top-18} Z`,fill:"#1e313a",stroke:"rgba(236,227,210,.2)"},1));
  for (let f=12; f>=1; f--){
    const y = f===1 ? top+11*fh : top+(12-f)*fh, h = f===1? gf : fh-3;
    const soon = NOT_ON_SALE.includes(f);
    const g = el("g",{class:"fl"+(soon?" soon":""),"data-f":f,tabindex:0,role:"option","aria-label":`Mərtəbə ${f}`+(soon?" (tezliklə satışda)":"")},1);
    g.append(el("rect",{class:"band",x:28,y,width:144,height:h},1));
    for (let i=0;i<10;i++) g.append(el("rect",{class:"win",x:36+i*13.4,y:y+5,width:8,height:h-10},1));
    const t = el("text",{x:22,y:y+h/2+4,"text-anchor":"end"},1); t.textContent = String(f).padStart(2,"0");
    const t2 = el("text",{x:178,y:y+h/2+4,class:"free","data-free":f},1);
    g.append(t,t2);
    if(soon){ const t3=el("text",{x:100,y:y+h/2+4,"text-anchor":"middle",class:"soon-t"},1); t3.textContent="TEZLİKLƏ"; g.append(t3); }
    g.addEventListener("click",()=>setFloor(f));
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();setFloor(f);} });
    s.append(g);
  }
  s.append(el("line",{x1:6,x2:194,y1:top+11*fh+gf+2,y2:top+11*fh+gf+2,stroke:"rgba(210,169,101,.6)"},1));
  const cap = el("div",{class:"elev-cap"}); cap.textContent = "Yaşıl rəqəm: satışda olan mənzil sayı";
  $("#elev").append(s,cap);
}

// ---- plan
const pathD = polys => polys.map(p=>"M"+p.map(q=>q.join(",")).join("L")+"Z").join("");
function centroid(polys){
  let best=null, ba=-1;
  polys.forEach(p=>{ let a=0,cx=0,cy=0; for(let i=0;i<p.length;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length];const c=x1*y2-x2*y1;a+=c;cx+=(x1+x2)*c;cy+=(y1+y2)*c;} a/=2; if(Math.abs(a)>ba){ba=Math.abs(a);best=[cx/(6*a),cy/(6*a)];} });
  return best;
}
function bbox(polys){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; polys.flat().forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}); return [x0,y0,x1,y1]; }
const HATCH = `<defs><pattern id="hSold" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#3fbf72" fill-opacity=".14"/><line x1="0" y1="0" x2="0" y2="10" stroke="#3fbf72" stroke-width="3"/></pattern><pattern id="hRes" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#f08a24" fill-opacity=".12"/><line x1="0" y1="0" x2="9" y2="0" stroke="#f08a24" stroke-width="2.4"/></pattern></defs>`;

const tip = $("#tip");
function showTip(u, x, y){
  const st = u.s!=="free" ? ` · <em style="font-style:normal;color:${u.s==="res"?"var(--res)":"#9aa5a8"}">${STXT[u.s]}</em>` : "";
  tip.innerHTML = `<b>${u.u}</b><span>${roomTxt(u.r)} · ${fmt(u.t)} m²${st}</span>`;
  tip.style.left = x+"px"; tip.style.top = y+"px"; tip.classList.add("show");
}
function hot(u, on){ document.querySelectorAll(`#explore [data-u="${u}"]`).forEach(n=>n.classList.toggle("hot",on)); }

function buildPlan(anim=true){
  const F = byF[cur], [vx,vy,vw,vh] = F.vb;
  const sc = $("#scroller"); sc.innerHTML="";
  let VB = F.vb;
  if(SHAPE && SHAPE.blk===blk && SHAPE.f===cur){ // close-up on the apartment being edited
    const all=[...SHAPE.orig,...SHAPE.pts]; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; all.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});
    const pad=Math.max(x1-x0,y1-y0)*.18; VB=[x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad];
  }
  const s = el("svg",{viewBox:VB.join(" "),"aria-label":`Mərtəbə ${cur} planı`},1);
  if(VB!==F.vb){ s.classList.add("closeup"); }
  s.innerHTML = HATCH;
  const IB = F.W ? [0,0,F.W,F.H] : F.vb;
  s.append(el("image",{href:F.img||`plan-${cur}.webp`,x:IB[0],y:IB[1],width:IB[2],height:IB[3],preserveAspectRatio:"none"},1));
  $("#compass").textContent = `Riviera ${blk} · Mərtəbə planı`;
  const fs = vw/90;
  const lab = el("g",{},1);
  F.units.map(U).forEach(u=>{
    const cls = `u ${TYPES[u.r]}${u.s!=="free"?" "+u.s:""}`;
    const p = el("path",{d:pathD(u.polys),class:cls,"data-u":u.u,"data-r":u.r,"data-s":u.s,tabindex:0,role:"button","aria-label":`Mənzil ${u.u}, ${roomTxt(u.r)}, ${fmt(u.t)} kvadratmetr, ${STXT[u.s]}`},1);
    p.addEventListener("mousemove",e=>showTip(u,e.clientX,e.clientY));
    p.addEventListener("mouseenter",()=>hot(u.u,true));
    p.addEventListener("mouseleave",()=>{tip.classList.remove("show");hot(u.u,false);});
    p.addEventListener("click",()=>{tip.classList.remove("show");openDrawer(u.u);});
    p.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();openDrawer(u.u);} });
    s.append(p);
    const [cx,cy] = centroid(u.polys);
    const t = el("text",{x:cx,y:cy+5,class:`ulabel${u.s==="sold"?" sold":""}`,"data-u":u.u,"data-r":u.r,"data-s":u.s},1); t.textContent = u.u;
    const fz = blk!==1 ? fs : 15;
    if(blk!==1){ t.setAttribute("style",`font-size:${fs}px;stroke-width:${fs*.28}px`); t.setAttribute("y",cy+fs*.35); }
    lab.append(t);
    const mk_=editMark(u.k); if(mk_){ const ts=el("tspan",{class:"emk "+mk_,dx:"3"},1); ts.textContent = mk_==="pend"?"✎":"✓"; t.append(ts); }
    if(u.s!=="free"){ t.setAttribute("y", cy - fz*.15); const t2=el("text",{x:cx,y:cy+fz*.95,class:`ulabel st ${u.s}`,"data-u":u.u,"data-r":u.r,"data-s":u.s},1); t2.textContent = (u.s==="pend"?"TEZLİKLƏ":STXT[u.s].toLocaleUpperCase("az")); t2.setAttribute("style",`font-size:${fz*.68}px;stroke-width:${fz*.25}px`); lab.append(t2); }
  });
  s.append(lab); sc.append(s); if(typeof applyZoom==="function") applyZoom(); if(SHAPE && SHAPE.blk===blk && SHAPE.f===cur) drawShape(s);
  const box=$("#planbox"); if(anim){ box.classList.remove("swap"); void box.offsetWidth; box.classList.add("swap"); }

  const ul = $("#ulist"); ul.innerHTML="";
  F.units.map(U).sort((a,b)=>a.u-b.u).forEach(u=>{
    const b = el("button",{"data-u":u.u,"data-r":u.r,"data-s":u.s,class:u.s,style:`--c:${TCOL[u.r]}`});
    b.innerHTML = `<b>${u.u}${(m=>m?`<span class="emk ${m}">${m==="pend"?" ✎":" ✓"}</span>`:"")(editMark(u.k))}</b><span>${fmt(u.t)} m²</span><em>${roomTxt(u.r)}</em>${u.s!=="free"?`<i class="${u.s}">${STXT[u.s]}</i>`:""}`;
    b.onclick=()=>openDrawer(u.u);
    b.onmouseenter=()=>hot(u.u,true); b.onmouseleave=()=>hot(u.u,false);
    ul.append(b);
  });
  applyFilter();
}

function setFloor(f, anim=true){
  if(NOT_ON_SALE.includes(f) && !editMode){ if(typeof toast==="function") toast(`${f}-ci mərtəbə hələ satışa çıxarılmayıb. Tezliklə!`); return; }
  if(f!==cur) active={1:true,2:true,3:true,4:true};
  cur = f;
  document.querySelectorAll(".fl").forEach(g=>{const on=+g.dataset.f===f; g.classList.toggle("on",on); g.setAttribute("aria-selected",on);});
  refreshCounts(); buildLegend(); buildPlan(anim);
}
function rerender(){ refreshCounts(); buildLegend(); buildPlan(false); if(openUnit) openDrawer(openUnit); }

function openDrawer(num){
  const F = byF[cur], list=F.units.map(U).sort((a,b)=>a.u-b.u), u = list.find(x=>x.u===num); if(!u) return;
  openUnit = num;
  $("#dr-eyebrow").textContent = `Riviera ${blk} · Mərtəbə ${cur}`;
  $("#dr-title").innerHTML = `${u.u}<span class="tag" style="--c:${TCOL[u.r]}">${roomTxt(u.r)}</span>`;
  $("#dr-sub").textContent = `Blok ${"ABC"[blk-1]} · ${cur}${ORD[cur]} mərtəbə`;
  $("#dr-status").innerHTML = `<span class="chip ${u.s}">${STXT[u.s]}</span>`;
  const [x0,y0,x1,y1]=bbox(u.polys), pad=Math.max(x1-x0,y1-y0)*.12;
  const vb=[x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad], [vx,vy,vw,vh]=F.vb;
  const z = el("svg",{viewBox:vb.join(" ")},1);
  const IB = F.W ? [0,0,F.W,F.H] : F.vb;
  z.append(el("image",{href:F.img||`plan-${cur}.webp`,x:IB[0],y:IB[1],width:IB[2],height:IB[3],preserveAspectRatio:"none"},1));
  const mask = el("path",{d:`M${vb[0]-5},${vb[1]-5}h${vb[2]+10}v${vb[3]+10}h-${vb[2]+10}Z`+pathD(u.polys),"fill-rule":"evenodd",fill:"rgba(16,27,33,.72)"},1);
  const ol = el("path",{d:pathD(u.polys),fill:"none","stroke-width":3},1); ol.style.stroke = TCOL[u.r];
  z.append(mask, ol);
  const zb=$("#dr-zoom"); zb.innerHTML=""; zb.append(z);
  $("#dr-specs").innerHTML = `
    <div><dt>Ümumi sahə</dt><dd>${fmt(u.t)}<small>m²</small></dd></div>
    <div><dt>Daxili sahə</dt><dd>${fmt(u.n)}<small>m²</small></dd></div>
    <div><dt>Otaq sayı</dt><dd>${u.r}</dd></div>
    <div><dt>Mərtəbə</dt><dd>${cur}<small>/ 12</small></dd></div>`;
  $("#dr-wa").href = waLink(u);
  renderEditor(u); renderCalc(u);
  const i=list.findIndex(x=>x.u===num);

  if(!drawer.contains(document.activeElement)) $("#dr-close").focus({preventScroll:true});

function closeDrawer(){ drawer.classList.remove("open"); scrim.classList.remove("open"); drawer.setAttribute("aria-hidden","true"); openUnit=null; }

      <h4>Redaktə · mənzil ${u.u}</h4>
      <div class="seg" role="group" aria-label="Status">
        ${["free","res","sold","pend"].map(s=>`<button type="button" data-s="${s}" aria-pressed="${u.s===s}">${STXT[s]}</button>`).join("")}
      </div>
      ${u.s==="res"&&u.d?`<p class="ednote">Rezerv tarixi: ${u.d} (${Math.max(0,Math.round((Date.now()-new Date(u.d))/864e5))} gün əvvəl)</p>`:""}
      <div class="erow">
        <label for="ed-t">Ümumi m²<input id="ed-t" type="number" step="0.1" min="10" max="500" value="${u.t}"></label>

        <label for="ed-r">Otaq<select id="ed-r">${[1,2,3,4,5].map(r=>`<option ${r===u.r?"selected":""}>${r}</option>`).join("")}</select></label>
      </div>
      <div class="erow">
        <label for="ed-q">1 m² qiyməti, $<input id="ed-q" type="number" inputmode="numeric" step="10" min="0" value="${u.q||(u.p&&u.t?Math.round(u.p/u.t):"")}"></label>
        <label for="ed-p" style="grid-column:span 2">Ümumi qiymət, $<input id="ed-p" type="number" inputmode="numeric" step="100" min="0" value="${u.p||""}" placeholder="m² qiyməti × ${fmt(u.t)} m²"></label>
      </div>
      <button class="btn edshape" id="ed-shape" type="button">Sərhədi planda düzəlt</button>
      <p class="ednote">Plandakı ilkin dəyər: ${fmt(base.t)} / ${fmt(base.n)} m², ${base.r} otaq. 1 m² qiymətini yazanda ümumi qiymət avtomatik hesablanır (m² qiyməti × ümumi sahə); ümumi qiyməti əl ilə də dəyişmək olar. Dəyişikliklər aşağıdakı "Yadda saxla" ilə hamıya görünəcək.</p>
    </div>`;
  box.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    const s=b.dataset.s; stage(u.k,{s, d: s==="res" ? (u.s==="res"&&u.d?u.d:today()) : null});
  });

  num("#ed-t","t"); num("#ed-n","n");
  $("#ed-r").onchange=e=>stage(u.k,{r:+e.target.value});
  $("#ed-q").oninput=e=>{ const q=+e.target.value; $("#ed-p").value = q>0 && u.t ? Math.round(q*u.t) : ""; };
  $("#ed-q").onchange=e=>{ const q=Math.round(+e.target.value)||null; stage(u.k,{q, p: q&&u.t?Math.round(q*u.t):null}); };
  $("#ed-p").onchange=e=>{ const v=Math.round(+e.target.value)||null; stage(u.k,{p:v, q: v&&u.t?Math.round(v/u.t):null}); };
  $("#ed-shape").onclick=()=>startShape(u);
}
function stage(num, patch){
  pending[num] = {...(STATE.units[num]||{}), ...(pending[num]||{}), ...patch};
  if(patch.polys===undefined && "polys" in patch) delete pending[num].polys;
  try{ sessionStorage.setItem("riv-pending", JSON.stringify(pending)); }catch(e){}
  updateSavebar(); rerender();
}
function updateSavebar(){
  const n=Object.keys(pending).length;
  $("#sv-count").textContent=n; $("#savebar").classList.toggle("show", n>0);
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),3200); }
$("#sv-undo").onclick=()=>{ for(const k in pending) delete pending[k]; try{sessionStorage.removeItem("riv-pending");}catch(e){} updateSavebar(); rerender(); };
const PIN_HASH="95e06e6bdfe25f9f988989b743294bd57fd62cad93c23ac3294f142de74e9918";

// ---- saving: the shared state lives in state.json of the GitHub repo (written with the sales team's token)
const GH = (()=>{ const h=location.hostname, m=h.match(/^([^.]+)\.github\.io$/i); let owner="__OWNER__", repo="__REPO__";
  if(m){ owner=m[1]; const seg=location.pathname.split("/").filter(Boolean)[0]; repo=(seg && !/\.html?$/i.test(seg))? seg : h; }
  return { owner, repo, branch: "main", path: "state.json" }; })();
const tokKey="riv-gh-token";
const getTok=()=>{ try{ return localStorage.getItem(tokKey)||""; }catch(e){ return ""; } };
function askToken(){ return new Promise(ok=>{ const box=$("#tokbox"); box.hidden=false; $("#tok").value=""; $("#tokerr").textContent=""; setTimeout(()=>$("#tok").focus(),50);
  $("#tokcancel").onclick=()=>{ box.hidden=true; ok(""); };
  $("#tokform").onsubmit=e=>{ e.preventDefault(); const t=$("#tok").value.trim(); if(t.length<20){ $("#tokerr").textContent=/^\d+$/.test(t)?"Bura PIN (211112) yox, GitHub açarı yazılır (github_pat_… ilə başlayır).":"Açar düzgün görünmür — github_pat_… ilə başlamalıdır."; return; } try{ localStorage.setItem(tokKey,t); }catch(err){} box.hidden=true; ok(t); }; }); }
const b64 = str => { const bytes=new TextEncoder().encode(str); let bin=""; bytes.forEach(c=>bin+=String.fromCharCode(c)); return btoa(bin); };
async function ghWrite(state, token){
  const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
  const hdr={Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"};
  const cur=await fetch(`${url}?ref=${GH.branch}&t=${Date.now()}`,{headers:hdr});
  if(cur.status===401||cur.status===403) throw {code:"auth"};
  const sha=cur.ok ? (await cur.json()).sha : undefined;
  const r=await fetch(url,{method:"PUT",headers:hdr,body:JSON.stringify({message:`Mənzil məlumatları yeniləndi · ${new Date().toISOString().slice(0,16).replace("T"," ")}`,content:b64(JSON.stringify(state)),branch:GH.branch,sha})});
  if(r.status===401||r.status===403) throw {code:"auth"};
  if(r.status===409) throw {code:"conflict"};
  if(!r.ok) throw {code:"http"};
}
$("#sv-save").onclick = async ()=>{
  const btn=$("#sv-save");
  if(GH.owner.startsWith("__")){ toast("Bu önbaxışdır — saxlama sayt GitHub-a qoyulandan sonra işləyəcək."); return; }
  let token=getTok(); if(!token){ token=await askToken(); if(!token) return; }
  btn.disabled=true; btn.textContent="Saxlanılır…";
  const next = {units:{...STATE.units}, pricing:{...(STATE.pricing||{})}, updated:new Date().toISOString()};
  for(const k in pending){ if(k==="__pricing"){ next.pricing={...next.pricing,...pending[k]}; continue; } const v={...pending[k]}; Object.keys(v).forEach(x=>{ if(v[x]==null) delete v[x]; }); if(v.s==="free") delete v.s; next.units[k]=v; }
  try{
    await ghWrite(next, token);
    STATE.units=next.units; STATE.pricing=next.pricing; STATE.updated=next.updated;
    for(const k in pending) delete pending[k];
    try{ sessionStorage.removeItem("riv-pending"); }catch(e){}
    updateSavebar(); rerender();
    toast("Yadda saxlanıldı. 1–2 dəqiqəyə hamıda görünəcək.");
  }catch(err){
    const c=err&&err.code;
    if(c==="auth"){ try{ localStorage.removeItem(tokKey); }catch(e){} toast("Açar qəbul olunmadı. Yenidən daxil edin."); }
    else if(c==="conflict") toast("Məlumat eyni anda başqa yerdə yeniləndi. Bir də \"Yadda saxla\" basın.");
    else toast("Yadda saxlanmadı. İnterneti yoxlayıb yenidən cəhd edin.");
  }
  btn.disabled=false; btn.textContent="Yadda saxla";
};

// ---- pricing + calculator (20% off for full payment; 10% down + 48 months at 0% on the full price)
const DISC=20, DOWN=10, MONTHS=48;
const ppm = b => { const P=(pending.__pricing||STATE.pricing||{}); return (P.ppm&&+P.ppm[b])||null; };
const priceOf = u => u.p ? +u.p : (ppm(blk) && u.t ? Math.round(ppm(blk)*u.t/10)*10 : null);
const usd = n => "$"+Math.round(n).toLocaleString("en-US").replace(/,/g,"\u00a0");
let calcMode = "full";
function calcFor(price, mode, downPct, months){
  if(!price) return null;
  if(mode==="full") return {mode, price, total:Math.round(price*(1-DISC/100)), save:Math.round(price*DISC/100)};
  const down=Math.round(price*downPct/100); return {mode, price, total:price, down, downPct, months, monthly:Math.round((price-down)/months)};
}
function renderCalc(u){
  const box=$("#dr-calc"), known=priceOf(u), q=u.q||(known&&u.t?Math.round(known/u.t):null);
  box.innerHTML = `<div class="calc">
    <h4>Ödəniş şərtləri</h4>
    ${known ? `<div class="res" style="border:0;padding:0"><div><span>Ümumi qiymət${q?`<br><small style="color:var(--mute)">${usd(q)} × ${fmt(u.t)} m²</small>`:""}</span><b>${usd(known)}</b></div></div><input id="c-price" type="hidden" value="${known}">`
      : `<label for="c-price">Ümumi qiymət, $<input id="c-price" type="number" inputmode="numeric" min="0" step="1000" placeholder="Qiyməti yazın"></label><p class="note">Bu mənzilin qiyməti hələ saytda göstərilmir. Satış ofisindən aldığınız qiyməti yazın və ya sorğu göndərin.</p>`}
    <div class="opt" role="group" aria-label="Ödəniş variantı"><button type="button" data-m="full" aria-pressed="${calcMode==="full"}">Tam ödəniş<br>−${DISC}% endirim</button><button type="button" data-m="plan" aria-pressed="${calcMode==="plan"}">Hissə-hissə<br>${DOWN}% ilkin, 0%</button></div>
    <div id="c-planf" ${calcMode==="plan"?"":"hidden"}>
      <label for="c-months">Neçə aya (maks. ${MONTHS})<input id="c-months" type="number" inputmode="numeric" min="1" max="${MONTHS}" value="${MONTHS}"></label>
    </div>
    <div class="res" id="c-res"></div>
    <button class="btn solid pickbtn" id="c-pick" type="button"></button>
  </div>`;
  const run=()=>{
    const pr=+$("#c-price").value||null, dp=DOWN, mi=$("#c-months"), m=Math.min(MONTHS,Math.max(1,Math.round(+mi.value||MONTHS)));
    const r=calcFor(pr,calcMode,dp,m), res=$("#c-res");
    if(!r){ res.innerHTML=`<p class="note">Hesablamaq üçün qiyməti yazın.</p>`; }
    else if(r.mode==="full") res.innerHTML=`<div><span>Qiymət</span><b>${usd(r.price)}</b></div><div><span>Endirim ${DISC}%</span><b>−${usd(r.save)}</b></div><div class="hl"><span>Tam ödənişlə</span><b>${usd(r.total)}</b></div>`;
    else res.innerHTML=`<div><span>Qiymət</span><b>${usd(r.price)}</b></div><div><span>İlkin ödəniş ${DOWN}%</span><b>${usd(r.down)}</b></div><div><span>Qalıq, ${r.months} aya bölünür</span><b>${usd(r.price-r.down)}</b></div><div class="hl"><span>Aylıq ödəniş (0%)</span><b>${usd(r.monthly)}</b></div>`;
    box._r={pr,dp,m};
    $("#c-pick").textContent = SEL.some(x=>x.k===u.k) ? "Seçimdə yenilə ✓" : "Bu mənzili seç";
  };
  box.querySelectorAll(".opt button").forEach(b=>b.onclick=()=>{ calcMode=b.dataset.m; box.querySelectorAll(".opt button").forEach(x=>x.setAttribute("aria-pressed",x===b)); $("#c-planf").hidden=calcMode!=="plan"; run(); });
  $("#c-price").addEventListener("input",run);
  $("#c-months").addEventListener("input",run);
  $("#c-months").addEventListener("change",e=>{ const v=Math.min(MONTHS,Math.max(1,Math.round(+e.target.value||MONTHS))); e.target.value=v; run(); });
  $("#c-pick").onclick=()=>{ const {pr,dp,m}=box._r; const item={k:u.k,blk,f:cur,u:u.u,r:u.r,t:u.t,n:u.n,price:pr,mode:calcMode,dp,m};
    const i=SEL.findIndex(x=>x.k===u.k); if(i<0) SEL.push(item); else SEL[i]=item; saveSel(); run(); toast(`${u.u} seçimlərinizə əlavə olundu`); };
  run();
}

function loadJsPDF(){ return window.jspdf ? Promise.resolve(window.jspdf) : new Promise((ok,no)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; sc.onload=()=>ok(window.jspdf); sc.onerror=no; document.head.appendChild(sc); }); }
function loadImg(src){ return new Promise(ok=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>ok(null); im.src=src; }); }
function wrapText(x,txt,maxW){ const words=txt.split(" "), out=[]; let line=""; for(const w of words){ const t=line?line+" "+w:w; if(x.measureText(t).width>maxW&&line){ out.push(line); line=w; } else line=t; } if(line) out.push(line); return out; }
async function drawUnitPlan(x,item,bx,by,bw,bh){
  const F=(BLK[item.blk]||[]).find(f=>f.f===item.f); if(!F) return;
  const base=F.units.find(u=>u.k===item.k); if(!base) return; const u=U(base), P=u.polys&&u.polys[0]; if(!P||P.length<3) return;
  const im=await loadImg(F.img||`plan-${item.f}.webp`); if(!im) return;
  const IB=F.W?[0,0,F.W,F.H]:F.vb, sx=im.naturalWidth/IB[2], sy=im.naturalHeight/IB[3];
  const pts=P.map(q=>[(q[0]-IB[0])*sx,(q[1]-IB[1])*sy]);
  const xs=pts.map(q=>q[0]), ys=pts.map(q=>q[1]); let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const pd=Math.max(x1-x0,y1-y0)*.05; x0-=pd;y0-=pd;x1+=pd;y1+=pd;
  const sc=Math.min(bw/(x1-x0),bh/(y1-y0)), ox=bx+(bw-(x1-x0)*sc)/2, oy=by+(bh-(y1-y0)*sc)/2;
  x.save(); x.beginPath(); x.rect(bx,by,bw,bh); x.clip();
  x.translate(ox,oy); x.scale(sc,sc); x.translate(-x0,-y0);
  x.beginPath(); pts.forEach((q,i)=>x[i?"lineTo":"moveTo"](q[0],q[1])); x.closePath();
  x.save(); x.clip(); x.drawImage(im,0,0); x.restore();
  x.lineWidth=3/sc; x.strokeStyle="#d2a965"; x.stroke(); x.restore();
}
async function offerCanvas(){

  x.fillStyle="#0f1a20"; x.fillRect(0,0,W,H); x.strokeStyle="rgba(210,169,101,.6)"; x.lineWidth=2; x.strokeRect(40,40,W-80,H-80);
  x.fillStyle="#ece3d2"; x.font='400 72px "Bodoni Moda",Georgia,serif'; x.fillText("RIVIERA",pad,pad+90);
  x.fillStyle="#d2a965"; x.font='500 22px Jost,system-ui,sans-serif'; x.fillText("PRIVATE RESIDENTIAL CLUB  ·  SEA BREEZE, BAKI",pad,pad+132);
  x.fillStyle="#b8b0a2"; x.font='400 24px Jost,system-ui,sans-serif'; x.fillText(`Seçilmiş mənzillər · ${new Date().toLocaleDateString("az-Latn-AZ")}`,pad,pad+190);
  if(nm||ph){ x.fillText([nm,ph].filter(Boolean).join(" · "),pad,pad+226); }
  x.fillStyle="rgba(210,169,101,.5)"; x.fillRect(pad,pad+258,W-2*pad,1);
  let y=pad+330;
  for(let i=0;i<rows.length;i++){ const l=rows[i], it=SEL[i];
    x.fillStyle="#ece3d2"; x.font='400 38px "Bodoni Moda",Georgia,serif'; x.fillText(`${i+1}.  ${l.head}`,pad,y);
    const bx=pad, by=y+26, bw=500, bh=340; await drawUnitPlan(x,it,bx,by,bw,bh);
    const tx=bx+bw+36, tw=W-pad-tx; let ty=by+30;
    x.fillStyle="#7f8e92"; x.font='600 18px Jost,system-ui,sans-serif'; x.fillText("SAHƏ",tx,ty); ty+=34;
    x.fillStyle="#ece3d2"; x.font='400 30px Jost,system-ui,sans-serif'; x.fillText(`${fmt(it.t)} m² ümumi`,tx,ty); ty+=38;
    x.fillStyle="#b8b0a2"; x.font='400 24px Jost,system-ui,sans-serif'; x.fillText(`${fmt(it.n)} m² daxili · ${it.r} otaq`,tx,ty); ty+=56;
    x.fillStyle="#7f8e92"; x.font='600 18px Jost,system-ui,sans-serif'; x.fillText("ÖDƏNİŞ",tx,ty); ty+=34;
    x.fillStyle="#d2a965"; x.font='500 25px Jost,system-ui,sans-serif';
    wrapText(x,l.pay,tw).forEach(t=>{ x.fillText(t,tx,ty); ty+=34; });
    y+=RH; }

  x.fillText("Qiymətlər ABŞ dolları ilədir və satış ofisi tərəfindən təsdiqlənməlidir.",pad,H-118);
  return cv;
}

// ---- shape editor (owner): drag points, tap a midpoint to add, select + delete
let SHAPE=null;
function cleanPts(P){ let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; P.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}); const tol=Math.max(x1-x0,y1-y0)*.045;
  const out=[]; for(const q of P){ const l=out[out.length-1]; if(!l||Math.hypot(q[0]-l[0],q[1]-l[1])>tol) out.push([q[0],q[1]]); }
  if(out.length>3&&Math.hypot(out[0][0]-out[out.length-1][0],out[0][1]-out[out.length-1][1])<=tol) out.pop(); return out.length>=3?out:P.map(q=>[q[0],q[1]]); }
function startShape(u){ SHAPE={k:u.k,blk,f:cur,u:u.u,pts:cleanPts(u.polys[0]),sel:-1}; closeDrawer(); $("#savebar").classList.remove("show");
  SHAPE.orig=(byF[cur].units.find(x=>x.k===u.k)||u).polys[0].map(q=>[q[0],q[1]]);
  $("#sh-title").textContent=`Sərhəd redaktəsi · ${u.u}`;
  $("#shapebar").classList.add("show"); buildPlan(false); requestAnimationFrame(focusShape); $("#planbox").scrollIntoView({behavior:"smooth",block:"start"}); }
$("#sh-reset").onclick=()=>{ if(!SHAPE) return; SHAPE.pts=SHAPE.orig.map(q=>[q[0],q[1]]); SHAPE.sel=-1; const s=$("#scroller svg"); if(s) drawShape(s); };
function endShape(){ SHAPE=null; $("#shapebar").classList.remove("show"); updateSavebar(); buildPlan(false); }

const ZOOMS=[1,1.5,2.2,3]; let zi=0;
function applyZoom(){ const s=$("#scroller svg"); if(!s||s.classList.contains("closeup")) return; const base=$("#scroller").clientWidth; s.style.minWidth = zi ? Math.round(base*ZOOMS[zi])+"px" : ""; }
function focusShape(){ const sc=$("#scroller"), p=sc.querySelector(".ed-poly"); if(!p) return; const a=p.getBoundingClientRect(), b=sc.getBoundingClientRect(); sc.scrollLeft += (a.left+a.width/2)-(b.left+b.width/2); }
$("#zin").onclick=()=>{ zi=Math.min(ZOOMS.length-1,zi+1); applyZoom(); if(SHAPE) focusShape(); };

function drawShape(svg){
  svg.classList.add("editing"); svg.querySelectorAll(".ed").forEach(e=>e.remove());
  const vbw=svg.viewBox.baseVal.width||byF[cur].vb[2], r=vbw/110, P=SHAPE.pts, g=el("g",{class:"ed"},1);
  g.append(el("polygon",{class:"ed-poly",points:P.map(q=>q.join(",")).join(" ")},1));
  P.forEach((q,i)=>{ const n=P[(i+1)%P.length]; if(Math.hypot(n[0]-q[0],n[1]-q[1])<r*8) return; const m=el("circle",{class:"ed-mid",cx:(q[0]+n[0])/2,cy:(q[1]+n[1])/2,r:r*.95},1);
    m.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); P.splice(i+1,0,[(q[0]+n[0])/2,(q[1]+n[1])/2]); SHAPE.sel=i+1; drawShape(svg); drag(svg,i+1); }); g.append(m);
    const tx=el("text",{class:"ed-mid-t",x:(q[0]+n[0])/2,y:(q[1]+n[1])/2+r*.55,"font-size":r*1.6},1); tx.textContent="+"; g.append(tx); });
  P.forEach((q,i)=>{ const c=el("circle",{class:"ed-pt"+(i===SHAPE.sel?" sel":""),cx:q[0],cy:q[1],r:i===SHAPE.sel?r*1.25:r},1), h=el("circle",{class:"ed-hit",cx:q[0],cy:q[1],r:r*3},1);
    const down=e=>{ e.preventDefault(); e.stopPropagation(); SHAPE.sel=i; drawShape(svg); drag(svg,i); }; c.addEventListener("pointerdown",down); h.addEventListener("pointerdown",down); g.append(h,c); });
  svg.append(g);
}
function drag(svg,i){
  const mv=e=>{ e.preventDefault(); const m=svg.getScreenCTM(); if(!m) return; const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); SHAPE.pts[i]=[Math.round(p.x*10)/10,Math.round(p.y*10)/10]; drawShape(svg); };
  const up=()=>{ removeEventListener("pointermove",mv); removeEventListener("pointerup",up); removeEventListener("pointercancel",up); };
  addEventListener("pointermove",mv,{passive:false}); addEventListener("pointerup",up); addEventListener("pointercancel",up);
}
$("#sh-del").onclick=()=>{ if(!SHAPE||SHAPE.sel<0||SHAPE.pts.length<=3) return; SHAPE.pts.splice(SHAPE.sel,1); SHAPE.sel=-1; const s=$("#scroller svg"); if(s) drawShape(s); };
$("#sh-cancel").onclick=endShape;
$("#sh-ok").onclick=()=>{ const sh=SHAPE; endShape(); if(sh&&sh.pts.length>=3){ stage(sh.k,{polys:[sh.pts]}); toast("Sərhəd dəyişdi — saxlamaq üçün \"Yadda saxla\" basın."); } };

    if(n.nodeType===3){const parts=n.textContent.split(/(\s+)/);const fr=document.createDocumentFragment();
      parts.forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){fr.append(document.createTextNode(" "));}else{const sp=document.createElement("span");sp.className="sw";sp.textContent=t;fr.append(sp);}});n.replaceWith(fr);}

 <label>${T("Qeyd (istəyə bağlı)","Комментарий (необязательно)","Note (optional)")}<textarea name="note" rows="2"></textarea></label>
 <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
 <div class="err" role="alert"></div>
 <div class="two"><button type="button" class="btn" data-x>${T("Bağla","Закрыть","Close")}</button><button type="submit" class="btn solid">${T("Göndər","Отправить","Send")}</button></div></form>`;
document.body.append(C);
const F=C.querySelector("form"),ER=C.querySelector(".err"),UN=C.querySelector(".units");
function selUnits(){try{return (typeof SEL!=="undefined"&&SEL.length)?SEL.map(x=>`Riviera ${x.blk} · №${x.u}`):[];}catch(e){return[];}}
let unitCtx=null;
function openC(ctx){unitCtx=ctx||null;const us=unitCtx?[unitCtx]:selUnits();UN.hidden=!us.length;UN.textContent=us.length?T("Mənzil: ","Квартира: ","Apartment: ")+us.join(", "):"";ER.textContent="";
  if(!F.isConnected){C.innerHTML="";C.append(F);}C.classList.add("open");C.setAttribute("aria-hidden","false");setTimeout(()=>F.name.focus(),80);ev("callback-open");}
function closeC(){C.classList.remove("open");C.setAttribute("aria-hidden","true");}
C.addEventListener("click",e=>{if(e.target===C||e.target.closest("[data-x]"))closeC();});
document.addEventListener("click",e=>{const b=e.target.closest("[data-cbk]");if(!b)return;e.preventDefault();window.__closeMenu&&window.__closeMenu();
  let ctx=null;try{if(b.closest("#drawer")&&typeof openUnit!=="undefined"&&openUnit)ctx=`Riviera ${blk} · №${openUnit}`;}catch(err){}openC(ctx);});
async function sendLead(d){
  const txt=`📞 Zəng sifarişi (riviera sayt)\nAd: ${d.name}\nTelefon: ${d.phone}\nVaxt: ${d.when}${d.units?`\nMənzil: ${d.units}`:""}${d.note?`\nQeyd: ${d.note}`:""}\nDil: ${L.toUpperCase()}`;
  if(LEAD.type==="formsubmit"){const r=await fetch(`https://formsubmit.co/ajax/${LEAD.to}`,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:"Riviera: zəng sifarişi",Ad:d.name,Telefon:d.phone,Vaxt:d.when,Mənzil:d.units||"-",Qeyd:d.note||"-",Dil:L.toUpperCase(),_template:"table",_captcha:"false"})});if(!r.ok)throw 0;return "sent";}
  if(LEAD.type==="telegram"){const [tok,chat]=LEAD.to.split("|");const r=await fetch(`https://api.telegram.org/bot${tok}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text:txt})});if(!r.ok)throw 0;return "sent";}
  // not configured yet: hand over to WhatsApp with the request filled in
  window.open(`https://wa.me/994508000747?text=${encodeURIComponent(txt)}`,"_blank","noopener");return "wa";
}
F.addEventListener("submit",async e=>{e.preventDefault();if(F.website.value)return;
  const d={name:F.name.value.trim(),phone:F.phone.value.trim(),when:F.when.value,note:F.note.value.trim(),units:UN.hidden?"":UN.textContent.replace(/^[^:]+:\s*/,"")};
  if(!d.name){ER.textContent=T("Adınızı yazın.","Укажите имя.","Please enter your name.");F.name.focus();return;}
  if(d.phone.replace(/\D/g,"").length<9){ER.textContent=T("Telefon nömrəsini tam yazın.","Укажите номер полностью.","Please enter a full phone number.");F.phone.focus();return;}
  const sb=F.querySelector('[type=submit]');sb.disabled=true;sb.textContent=T("Göndərilir…","Отправка…","Sending…");
  try{const how=await sendLead(d);ev("callback-sent");
    const done=document.createElement("div");done.className="done";done.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3L17 9"/></svg><b>${T("Təşəkkürlər!","Спасибо!","Thank you!")}</b><p>${how==="wa"?T("Sorğunuz WhatsApp-da hazırdır — göndər düyməsini basın.","Заявка готова в WhatsApp — нажмите «Отправить».","Your request is ready in WhatsApp — just press send."):T("Satış ofisi tezliklə sizə zəng edəcək.","Отдел продаж скоро вам перезвонит.","The sales office will call you shortly.")}</p><button type="button" class="btn" data-x>${T("Bağla","Закрыть","Close")}</button>`;
    F.reset();C.innerHTML="";C.append(done);}
  catch(err){ER.textContent=T("Göndərilmədi. WhatsApp və ya zənglə əlaqə saxlayın.","Не отправлено. Напишите в WhatsApp или позвоните.","Couldn't send. Please use WhatsApp or call.");}
  finally{sb.disabled=false;sb.textContent=T("Göndər","Отправить","Send");}
});
// buttons: contact section, unit drawer, selection drawer
const mk=(cls)=>{const b=document.createElement("button");b.type="button";b.className="btn "+(cls||"");b.dataset.cbk="";b.textContent=T("Zəng sifariş et","Заказать звонок","Request a call");return b;};
const CALLBACK_ON=false;
const row=document.querySelector("#contact .row");if(CALLBACK_ON&&row)row.insertBefore(mk(),row.children[1]||null);
const sa=document.querySelector("#seldrawer .selacts");if(CALLBACK_ON&&sa)sa.insertBefore(mk(),sa.children[1]||null);
const drc=document.querySelector("#drawer .dr-cta");if(CALLBACK_ON&&drc){const b=mk();b.style.gridColumn="1/-1";drc.append(b);}
})();
</script>

</body>
</html>
